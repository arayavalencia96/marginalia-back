<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your Marginalia account</title>
</head>
<body style="margin:0;background:#f5f5f4;font-family:Arial,sans-serif;color:#292524;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
                   style="max-width:560px;background:#ffffff;border-radius:12px;padding:40px;">
                <tr>
                    <td>
                        <h1 style="margin:0 0 16px;font-size:24px;">Verify your email</h1>
                        <p style="margin:0 0 24px;line-height:1.6;">
                            Enter this verification code in Marginalia to finish setting up your account.
                        </p>
                        <div style="padding:18px;background:#f5f5f4;border-radius:8px;text-align:center;
                                    font-size:32px;font-weight:700;letter-spacing:8px;">
                            {{verificationCode}}
                        </div>
                        <p style="margin:24px 0 0;color:#78716c;font-size:14px;line-height:1.5;">
                            If you did not request this code, you can safely ignore this email.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
